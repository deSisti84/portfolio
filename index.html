<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="IT systems, security training, knowledgebases, OpenVPN, and GLPI projects by Milos Dimitrijevic.">
    <title>Milos Dimitrijevic — Portfolio</title>
    <link rel="stylesheet" href="styles.css?v=7">
    <script src="script.js?v=3" defer></script>
  </head>
  <body>
    <main class="portfolio-shell">
      <header class="site-header">
        <p class="eyebrow">IT systems · Security · Documentation</p>
      </header>

      <section class="hero" aria-labelledby="portfolio-title">
        <div class="intro">
          <p class="section-label">Interactive curriculum vitae</p>
          <h1 id="portfolio-title">Milos<span>Dimitrijevic</span></h1>
        </div>

        <div class="tile-grid" id="projects" aria-label="Portfolio projects">
          <div class="decorative-block decor-two" aria-hidden="true"></div>
          <div class="decorative-block decor-three" aria-hidden="true"></div>
          <div class="decorative-block decor-four" aria-hidden="true"></div>
          <div class="decorative-block decor-five" aria-hidden="true"></div>
          <div class="decorative-block decor-six" aria-hidden="true"></div>
          <button class="project-tile tile-security" data-project="Security trainings" aria-label="Open Security trainings preview">
            <span class="tile-index">01</span><span class="tile-title">Security trainings</span><span class="tile-action" aria-hidden="true">↗</span>
          </button>
          <button class="project-tile tile-knowledge" data-project="Knowledgebases" aria-label="Open Knowledgebases preview">
            <span class="tile-index">02</span><span class="tile-title">Knowledgebases</span><span class="tile-action" aria-hidden="true">↗</span>
          </button>
          <button class="project-tile tile-openvpn" data-project="OpenVPN" aria-label="Open OpenVPN preview">
            <span class="tile-index">03</span><span class="tile-title">OpenVPN</span><span class="tile-action" aria-hidden="true">↗</span>
          </button>
          <button class="project-tile tile-glpi" data-project="GLPI" aria-label="Open GLPI preview">
            <span class="tile-index">04</span><span class="tile-title">GLPI</span><span class="tile-action" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <footer><span>Portfolio</span></footer>
    </main>

    <div class="modal-backdrop" id="project-modal" role="presentation" hidden>
      <section class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-heading">
          <div><p class="section-label">Project preview</p><h2 id="modal-title"></h2></div>
          <button class="close-button" type="button" data-modal-close aria-label="Close project preview">×</button>
        </div>
        <div class="video-placeholder">
          <span class="play-button" aria-hidden="true">▶</span>
          <p>Video preview coming soon</p>
          <small>Your project video can be added here later.</small>
        </div>
      </section>
    </div>
  </body>
</html>
